<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Restaurant Alert Web Component</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">

    <h1>Restaurant Alert</h1>

    <p class="subtitle">
      Custom Web Component Demonstration
    </p>


    <div class="demo-box">

      <restaurant-alert
        type="success"
        message="Order ORD-1024 has been accepted successfully."
      ></restaurant-alert>


      <restaurant-alert
        type="warning"
        message="Mozzarella stock is running low."
      ></restaurant-alert>


      <restaurant-alert
        type="error"
        message="Unable to update order status."
      ></restaurant-alert>


      <restaurant-alert
        type="info"
        message="New online order has been received."
      ></restaurant-alert>
      
      <button id="add-alert-button">
  + Add New Alert
</button>
    </div>

  </div>


  <script src="restaurant-alert.js"></script>
  <script>

  document.addEventListener(
    "alert-closed",
    function (event) {

      console.log(
        "Alert closed:",
        event.detail.message
      );

    }
  );

</script>
<script>

  const addAlertButton =
    document.getElementById("add-alert-button");


  addAlertButton.addEventListener(
    "click",
    function () {

      const newAlert =
        document.createElement("restaurant-alert");


      newAlert.setAttribute(
        "type",
        "success"
      );


      newAlert.setAttribute(
        "message",
        "New order ORD-1050 has been added."
      );


      document
        .querySelector(".demo-box")
        .appendChild(newAlert);

    }
  );

</script>
</body>

</html>
